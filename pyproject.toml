[project]
name = "billetterie"
version = "0.1.0"
description = "Plateforme de billetterie en ligne : monorepo des microservices FastAPI."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "billetterie-billets",
    "billetterie-catalogue",
    "billetterie-commandes",
    "billetterie-commun",
    "billetterie-echo",
    "billetterie-notifications",
    "billetterie-paiements",
    "billetterie-verificateur",
]

[tool.uv]
# La racine ne se publie pas : elle sert uniquement de chapeau au workspace.
package = false

[tool.uv.workspace]
# libs/ porte la bibliothèque billetterie-commun (module « commun ») ;
# chaque service a son propre pyproject.toml ; infra/verificateur est le vérificateur de jetons
# appelé par Traefik. Liste explicite, pas « services/* » : le contrat d'un nouveau service
# (services/<nom>/openapi.yaml) existe avant son code, son dossier n'est alors pas un membre.
# Ajouter le service ici quand son pyproject.toml est créé (tests/unit/test_workspace.py).
members = [
    "libs",
    "services/echo",
    "services/catalogue",
    "services/billets",
    "services/commandes",
    "services/paiements",
    "services/notifications",
    "infra/verificateur",
]

[tool.uv.sources]
billetterie-billets = { workspace = true }
billetterie-catalogue = { workspace = true }
billetterie-commandes = { workspace = true }
billetterie-commun = { workspace = true }
billetterie-echo = { workspace = true }
billetterie-notifications = { workspace = true }
billetterie-paiements = { workspace = true }
billetterie-verificateur = { workspace = true }

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = [
    "billets",
    "catalogue",
    "commandes",
    "commun",
    "echo",
    "notifications",
    "paiements",
    "verificateur",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
# Dossiers vérifiés par `uv run mypy` : ajouter services/<nom>/src à la création de chaque service.
files = [
    "libs",
    "services/echo/src",
    "services/catalogue/src",
    "services/billets/src",
    "services/commandes/src",
    "services/paiements/src",
    "services/notifications/src",
    "infra/verificateur/src",
]

[tool.pytest.ini_options]
testpaths = ["tests", "services", "libs", "infra/verificateur"]
# Chaque service a ses propres tests/unit, tests/integration : le mode importlib évite les
# conflits entre fichiers de test de même nom. Les smoke tests visent la plateforme lancée par
# make up : exclus par défaut, joués par make test-smoke (un -m sur la ligne de commande
# remplace celui-ci).
addopts = "--import-mode=importlib -m 'not smoke'"
markers = [
    "contract: compare le schéma OpenAPI généré par FastAPI au contrat validé",
    "smoke: parcours de bout en bout contre la plateforme démarrée (make test-smoke)",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "jsonschema>=4.26.0",
    "mypy>=2.4.0",
    "openapi-spec-validator>=0.9.0",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "ruff>=0.17.1",
    "testcontainers>=4.15.0",
    "types-pyyaml>=6.0.12.20260906",
]
