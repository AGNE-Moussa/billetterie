[project]
name = "billetterie"
version = "0.1.0"
description = "Plateforme de billetterie en ligne : monorepo des microservices FastAPI."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "billetterie-commun",
]

[tool.uv]
# La racine ne se publie pas : elle sert uniquement de chapeau au workspace.
package = false

[tool.uv.workspace]
# Chaque service devient membre dès qu'il a son propre pyproject.toml.
# libs/ porte la bibliothèque billetterie-commun (module « commun »).
members = ["libs"]

[tool.uv.sources]
billetterie-commun = { workspace = true }

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["commun"]

[tool.mypy]
python_version = "3.12"
strict = true
# Dossiers vérifiés par `uv run mypy` : ajouter services/<nom> à la création de chaque service.
files = ["libs"]

[tool.pytest.ini_options]
testpaths = ["tests", "services", "libs"]
markers = [
    "contract: compare le schéma OpenAPI généré par FastAPI au contrat validé",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "testcontainers>=4.15.0",
]
