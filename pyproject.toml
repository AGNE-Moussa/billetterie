[project]
name = "billetterie"
version = "0.1.0"
description = "Plateforme de billetterie en ligne : monorepo des microservices FastAPI."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv]
# La racine ne se publie pas : elle sert uniquement de chapeau au workspace.
package = false

[tool.uv.workspace]
# Chaque service et chaque lib deviendra membre dès qu'il aura son propre
# pyproject.toml (service echo, puis libs/commun à partir de BIL-F11).
# uv refuse un membre sans pyproject.toml : la liste reste vide d'ici là.
members = []

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests", "services", "libs"]
markers = [
    "contract: compare le schéma OpenAPI généré par FastAPI au contrat validé",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
