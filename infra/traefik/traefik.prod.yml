# Configuration statique de Traefik pour la démo (compose.prod.yaml) : HTTPS Let's Encrypt.
# La configuration locale reste dans traefik.yml.
#
# Traefik n'interpole pas les variables d'environnement dans sa configuration statique :
# demarrer-prod.sh remplace ${DOMAINE}, ${ACME_EMAIL} et ${ACME_CA_SERVER} au démarrage du
# conteneur (valeurs lues dans .env.prod), puis lance Traefik sur le fichier obtenu.

entryPoints:
  # HTTP : seulement le challenge HTTP-01 de Let's Encrypt et la redirection vers HTTPS.
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"
    http:
      tls:
        certResolver: letsencrypt
        # Les routeurs n'ont que des règles PathPrefix : le domaine du certificat est donné ici.
        domains:
          - main: "${DOMAINE}"
  # Ping (healthcheck du conteneur) ; jamais publié par compose.prod.yaml.
  traefik:
    address: ":8080"

certificatesResolvers:
  letsencrypt:
    acme:
      email: "${ACME_EMAIL}"
      # Autorité de staging au premier déploiement, puis production (ACME_CA_SERVER).
      caServer: "${ACME_CA_SERVER}"
      # Sur le volume nommé traefik-acme : les certificats survivent aux redéploiements.
      storage: /acme/acme.json
      httpChallenge:
        entryPoint: web

# Tableau de bord coupé en démo.
api:
  dashboard: false
  insecure: false

ping:
  entryPoint: traefik

providers:
  consulCatalog:
    endpoint:
      address: "consul:8500"
    # Un service n'est routé que s'il le demande (tag traefik.enable=true).
    exposedByDefault: false
    refreshInterval: 5s
    # Seules les instances au check passing reçoivent des appels.
    strictChecks:
      - passing
  file:
    filename: /etc/traefik/dynamique.yml
    watch: true

experimental:
  localPlugins:
    correlation:
      moduleName: github.com/billetterie/correlation

# Ni métriques ni traces en démo : Prometheus et Tempo ne sont pas déployés.

log:
  level: INFO
