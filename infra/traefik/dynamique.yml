# Middlewares partagés, référencés par les tags Consul des services :
#   traefik.http.routers.<nom>.middlewares=standard@file     (API des clients du front)
#   traefik.http.routers.<nom>.middlewares=partenaires@file  (API des revendeurs)
#   traefik.http.routers.<nom>.middlewares=public@file       (Keycloak et fichiers du front)
# Chaque service déclare sa route dans ses tags ; seul le routeur de repli 503 (`repli-api`, en
# fin de fichier) est déclaré ici.
# standard et partenaires vérifient le jeton : un service est protégé par défaut, ses routes
# publiques se déclarent dans ROUTES_PUBLIQUES du vérificateur.

http:
  middlewares:
    correlation:
      plugin:
        correlation:
          header: X-Correlation-Id

    cors:
      headers:
        accessControlAllowOriginList:
{{- range $origine := splitList "," (env "CORS_ORIGINS") }}
          - "{{ trim $origine }}"
{{- end }}
        accessControlAllowMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
        accessControlAllowHeaders: [Authorization, Content-Type, X-Correlation-Id]
        accessControlExposeHeaders: [X-Correlation-Id]
        accessControlMaxAge: 600

    # Par adresse IP du client.
    limite-generale:
      rateLimit:
        average: 50
        burst: 100
        period: 1s

    # Par jeton : chaque revendeur a son propre quota, plus strict.
    limite-partenaires:
      rateLimit:
        average: 5
        burst: 10
        period: 1s
        sourceCriterion:
          requestHeaderName: Authorization

    # Vérification du JWT par infra/verificateur avant le routage (401 sans jeton valide).
    # Traefik retire de la requête les en-têtes listés avant d'y recopier ceux du vérificateur :
    # un client ne peut pas fournir lui-même un X-User-Id.
    # Chaîne standard : le vérificateur refuse un jeton partner (403 ROLE_MANQUANT), un
    # revendeur ne contourne pas son quota (BIL-012, décision Q2).
    verification-jeton:
      forwardAuth:
        address: http://verificateur:8000/verifier
        authResponseHeaders: [X-User-Id, X-User-Roles, X-Client-Id]

    # Chaîne partenaires : seul un jeton partner passe (403 ROLE_MANQUANT sinon) ; sans jeton,
    # une route publique passe comme sur la chaîne standard.
    verification-jeton-partenaires:
      forwardAuth:
        address: http://verificateur:8000/verifier/partenaires
        authResponseHeaders: [X-User-Id, X-User-Roles, X-Client-Id]

    # Instance injoignable (tuée, pas encore retirée de Consul) : la requête est rejouée vers
    # une autre instance. Seules les erreurs réseau sont rejouées, jamais une réponse HTTP.
    # Limite : une instance qui meurt après avoir traité un POST, avant d'avoir répondu, voit
    # ce POST rejoué ailleurs (docs/pannes-infra.md).
    nouvelles-tentatives:
      retry:
        attempts: 3
        initialInterval: 100ms

    # Le CORS passe avant la vérification : un preflight OPTIONS n'a jamais de jeton.
    # Les nouvelles tentatives viennent en dernier : seul l'appel au service est rejoué.
    standard:
      chain:
        middlewares: [correlation, cors, limite-generale, verification-jeton, nouvelles-tentatives]

    # Le quota par jeton ne compte que les jetons valides.
    partenaires:
      chain:
        middlewares:
          - correlation
          - cors
          - verification-jeton-partenaires
          - limite-partenaires
          - nouvelles-tentatives

    # Sans vérification : Keycloak délivre les jetons, il ne peut pas en exiger un ; les
    # fichiers du front se chargent avant toute connexion.
    public:
      chain:
        middlewares: [correlation, cors, limite-generale]

    # Repli : toute requête /api reçoit le 503 Problem Details du vérificateur.
    repli-indisponible:
      replacePath:
        path: /indisponible

    # Marque les réponses du repli : un client (ou un test qui attend la découverte d'une route)
    # distingue « service sans instance » d'une réponse du service lui-même.
    repli-marque:
      headers:
        customResponseHeaders:
          X-Gateway-Repli: "true"

  # Routeur de repli, seule route déclarée ici. Priorité 1 : il ne sert que lorsqu'aucun routeur
  # de service ne correspond, c'est-à-dire quand le service n'a plus d'instance saine dans
  # Consul (son routeur disparaît). Le client reçoit alors 503 SERVICE_INDISPONIBLE au lieu du
  # 404 de Traefik. Le front (priorité 1 aussi) exclut /api : les deux règles ne se recouvrent
  # pas. Sans entryPoints : actif sur web (local) comme sur websecure (démo).
  routers:
    repli-api:
      rule: PathPrefix(`/api`)
      priority: 1
      middlewares: [public, repli-marque, repli-indisponible]
      service: indisponible

  services:
    indisponible:
      loadBalancer:
        servers:
          - url: http://verificateur:8000
