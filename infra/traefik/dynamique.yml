# Middlewares partagés, référencés par les tags Consul des services :
#   traefik.http.routers.<nom>.middlewares=standard@file     (front et clients)
#   traefik.http.routers.<nom>.middlewares=partenaires@file  (API des revendeurs)
#   traefik.http.routers.<nom>.middlewares=public@file       (Keycloak seulement)
# Aucune route ici : chaque service déclare la sienne dans ses tags.
# standard et partenaires vérifient le jeton : un service est protégé par défaut, ses routes
# publiques se déclarent dans ROUTES_PUBLIQUES du vérificateur.

http:
  middlewares:
    correlation:
      plugin:
        correlation:
          header: X-Correlation-Id

    cors:
      headers:
        accessControlAllowOriginList:
{{- range $origine := splitList "," (env "CORS_ORIGINS") }}
          - "{{ trim $origine }}"
{{- end }}
        accessControlAllowMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
        accessControlAllowHeaders: [Authorization, Content-Type, X-Correlation-Id]
        accessControlExposeHeaders: [X-Correlation-Id]
        accessControlMaxAge: 600

    # Par adresse IP du client.
    limite-generale:
      rateLimit:
        average: 50
        burst: 100
        period: 1s

    # Par jeton : chaque revendeur a son propre quota, plus strict.
    limite-partenaires:
      rateLimit:
        average: 5
        burst: 10
        period: 1s
        sourceCriterion:
          requestHeaderName: Authorization

    # Vérification du JWT par infra/verificateur avant le routage (401 sans jeton valide).
    # Traefik retire de la requête les en-têtes listés avant d'y recopier ceux du vérificateur :
    # un client ne peut pas fournir lui-même un X-User-Id.
    verification-jeton:
      forwardAuth:
        address: http://verificateur:8000/verifier
        authResponseHeaders: [X-User-Id, X-User-Roles, X-Client-Id]

    # Instance injoignable (tuée, pas encore retirée de Consul) : la requête est rejouée vers
    # une autre instance. Seules les erreurs réseau sont rejouées, jamais une réponse HTTP.
    # Limite : une instance qui meurt après avoir traité un POST, avant d'avoir répondu, voit
    # ce POST rejoué ailleurs (docs/pannes-infra.md).
    nouvelles-tentatives:
      retry:
        attempts: 3
        initialInterval: 100ms

    # Le CORS passe avant la vérification : un preflight OPTIONS n'a jamais de jeton.
    # Les nouvelles tentatives viennent en dernier : seul l'appel au service est rejoué.
    standard:
      chain:
        middlewares: [correlation, cors, limite-generale, verification-jeton, nouvelles-tentatives]

    # Le quota par jeton ne compte que les jetons valides.
    partenaires:
      chain:
        middlewares:
          [correlation, cors, verification-jeton, limite-partenaires, nouvelles-tentatives]

    # Sans vérification : Keycloak délivre les jetons, il ne peut pas en exiger un.
    public:
      chain:
        middlewares: [correlation, cors, limite-generale]
