function pix(rows,pal,s){
  const w=rows[0].length;let r="";
  rows.forEach((row,y)=>[...row].forEach((c,x)=>{if(c!=="."&&pal[c])r+=`<rect x="${x*s}" y="${y*s}" width="${s}" height="${s}" fill="${pal[c]}"/>`}));
  return {svg:r,w:w*s,h:rows.length*s};
}
const BOT=[
"....CCCCCCCC......",
"...CCCCCCCCCC.....",
"..CCCCCCCCCCCC....",
"..CCCCCCCCCCCC....",
".VVVVVVVVVVVVVVV..",
"..OBBBBBBBBBBBO...",
"..BBBBBBBBBBBBB...",
"..BBDDDDDDDDDBB...",
"..BBDWWDDDWWDBB...",
"..BBDWWDDDWWDBB...",
"..BBDDDDDDDDDBB...",
"..BBBBBMMMBBBBB...",
"AABBBBBBBBBBBBBAA.",
"AABBBBBBBBBBBBBAA.",
"..BBBBBBBBBBBBB...",
"..BBB..BBB..BBB...",
"..KKK..KKK..KKK..."];
function mascot(cap,capDark,initials,acc){
  const s=4;
  const pal={C:cap,V:capDark,B:"#2bb3a3",O:"#5fd0c2",D:"#163b45",W:"#e8fffb",M:"#0f6f63",A:"#1f9789",K:"#163b45"};
  const b=pix(BOT,pal,s),a=acc(s);
  const W=b.w+a.w-8,H=Math.max(b.h,a.h+a.dy)+2;
  return `<svg width="${Math.round(W*1.15)}" height="${Math.round(H*1.15)}" viewBox="0 0 ${W} ${H}" shape-rendering="crispEdges" role="img" aria-label="mascotte ${initials}">
   ${b.svg}
   <text x="${7*s+2}" y="${3*s+1}" text-anchor="middle" font-family="Consolas,monospace" font-weight="900" font-size="${2.6*s}" fill="#fff">${initials}</text>
   <g transform="translate(${b.w-8},${a.dy})">${a.svg}</g></svg>`;
}
const acc=(rows,pal,dyRows)=>s=>{const p=pix(rows,pal,s);p.dy=dyRows*s;return p;};

 review:["Place prise : message clair, plan rafraîchi, aucune erreur non gérée","Compte à rebours fondé sur l'expiration de l'API, pas sur une horloge locale","Chaque place atteignable au clavier, focus visible","Client d'API généré, jeton gardé en mémoire","Aucun test modifié depuis l'étape tests","Rapport <code>docs/reviews/BIL-020.md</code>"],
 reviewWho:"Validation 2 : un point bloquant renvoie à implementer",
 merge:["<code>/open-pr</code> : commit Conventional Commits, push, PR qui cite le ticket, le plan et la review","Ticket Notion en IN REVIEW, lien de la PR en commentaire","CI verte : ESLint, Vitest, Playwright","Un échec de CI renvoie à implementer","TO TEST puis DONE, décidés par le développeur"],
 mergeWho:"Merge par le développeur ; gh pr merge bloqué pour Claude"
}];

function mini(o,cls){return `<div class="mini ${cls}${o.off?" off":""}"><h4>${o.h}</h4><ul>${o.items.map(x=>`<li><span>${x}</span></li>`).join("")}</ul></div>`;}

function board(b){
 const T=TYPES[b.key],front=b.key==="front";
 const v=n=>`var(--${n})`;
 return `<div class="scroll"><section class="board" id="board-${b.key}">
 <div class="top"><div><div class="eyebrow">${b.eyebrow}</div><h1>${b.title}</h1><div class="feat">${b.feat}</div></div>
 <div class="feat">Branche <code>${b.branch}</code></div></div>

 <div class="G colhead"><div></div>
  ${STEPS.map((s,i)=>`<div class="ch" style="color:${v(s[1])};border-color:${v(s[1])}"><div class="n">${i+1}.</div><div class="t">${s[0]}</div></div>`).join("")}
 </div>

 <div class="G lane"><div class="lanelabel">${folder("#f2b33d","#d98f12")}.claude/skills/</div>
  <div class="cell">${chip("ticket","/ticket "+(front?"BIL-020":"BIL-006"),"lit Notion, orchestre",v("s1"))}</div>
  <div class="cell"></div><div class="cell"></div>
  <div class="cell">${chip("tests","/write-tests","répartit, vérifie le rouge",v("s4"))}</div>
  <div class="cell"></div><div class="cell"></div>
  <div class="cell">${chip("pr","/open-pr","commit, push, PR",v("s7"))}</div>
 </div>

 <div class="G lane"><div class="lanelabel">${folder("#d64545","#a82f2f")}.claude/agents/</div>
  <div class="cell"></div>
  <div class="cell">${front?`<span class="skip">contract-writer non lancé</span>`:AG.cw()}</div>
  <div class="cell">${AG.tp()}</div>
  <div class="cell">${AG.ut()}${AG.it()}</div>
  <div class="cell">${AG.im()}</div>
  <div class="cell">${AG.rv()}</div>
  <div class="cell"></div>
 </div>

 <div class="G lane"><div class="lanelabel">${icon("user","currentColor",22)}Développeur</div>
  <div class="cell"></div>
  <div class="cell">${front?`<span class="skip">pas de validation</span>`:human("Validation du contrat",v("s2"))}</div>
  <div class="cell">${human("Validation 1 : le plan",v("s3"))}</div>
  <div class="cell"></div><div class="cell"></div>
  <div class="cell">${human("Validation 2 : la review",v("s6"))}</div>
  <div class="cell">${human("Merge, TO TEST, DONE",v("s7"))}</div>
 </div>

 <div class="G lane"><div class="lanelabel" style="font-size:14px">.claude/etape</div>
  ${MARKERS.map((m,i)=>`<div class="cell">${front&&i===1?`<span class="skip">sauté</span>`:`<div class="marker">${m}<i>${MARKNOTE[i]}</i></div>`}</div>`).join("")}
 </div>

 <div class="G body">
  <div class="legend"><div class="lt">Niveau de test</div>
   ${T.map(t=>`<div class="li"><div class="dot" style="background:${v(t[0])}"></div><div><b>${t[1]}</b><br><span class="sub">${t[2]}</span><br><span class="sub">écrit par <b>${t[3]}</b></span></div></div>`).join("")}
   <div class="lt" style="margin-top:12px">État du cas</div>
   <div class="li">${okSvg(v("s3"))} dans le plan validé</div>
   <div class="li"><span class="st red">✕ échoue</span> test écrit, code absent</div>
   <div class="li"><span class="st green">✓ passe</span> code écrit, test vert</div>
  </div>
  <div>${mini(b.cadrage,"c1")}</div>
  <div>${mini(b.contrat,"c2")}</div>
  <div class="groups">
   ${b.groups.map(g=>`<div class="grp"><div class="gt">${g[0]} <span>${g[1]}</span></div>
    ${g[2].map(c=>`<div class="row">
      <div class="ca"><span class="ok">${okSvg(v("s3"))}</span><span class="id">${c[0]}</span><span class="tx">${c[1]}</span><span class="dots">${c[2].map(t=>`<span class="dot" style="background:${v(t)}"></span>`).join("")}</span></div>
      <div class="tt"><span class="ar"></span><span class="lab">${c[3]}<i>${c[4]}</i></span><span style="margin-left:auto" class="st red">✕ échoue</span></div>
      <div class="c3c"><span class="st green">✓ passe</span></div>
    </div>`).join("")}</div>`).join("")}
  </div>
  <div class="panel p6"><h3>Rapport du reviewer</h3><ul>${b.review.map(x=>`<li><span class="box"></span><span>${x}</span></li>`).join("")}</ul>
   <div class="who">${b.reviewWho}</div></div>
  <div class="panel p7"><h3>Jusqu'au merge</h3><ul>${b.merge.map(x=>`<li><span class="box"></span><span>${x}</span></li>`).join("")}</ul>
   <div class="who">${b.mergeWho}</div></div>
 </div>

 <div class="foot"><span>Hooks toujours actifs : ${front?"Prettier et ESLint":"ruff format et ruff check"}, <code>.env</code> et secrets bloqués, aucune écriture sur main, Git sûr (<code>git push --force</code> et <code>gh pr merge</code> bloqués), tests rapides en fin de tour, hook <code>commit-msg</code>.</span><span style="white-space:nowrap"><code>/smoke-tests</code> reste hors pipeline</span></div>
 </section></div>`;
}
document.getElementById("root").innerHTML=BOARDS.map(board).join("");
</script>
