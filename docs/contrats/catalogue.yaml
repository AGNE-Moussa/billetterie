# Contrat OpenAPI 3.1 cible du service catalogue (BIL-002) : la référence des tickets US.
# Chaque ticket US recopie ses routes dans services/catalogue/openapi.yaml avec le code ;
# ce fichier-ci est seulement validé (openapi-spec-validator), pas comparé au code.
# Lectures publiques (sans jeton, déclarées dans ROUTES_PUBLIQUES du vérificateur) ; écritures
# réservées à l'admin. Les catégories de places tarifées d'une séance sont créées avec elle et
# lues dans la séance. À la création d'une séance, Catalogue publie ticketing.show.scheduled
# (Billets en crée les places) ; à son annulation, ticketing.show.cancelled.
# Ressources routées par Traefik : events, venues et shows (préfixe shows à ajouter aux tags
# Traefik et à ROUTES_PUBLIQUES au ticket US).
openapi: 3.1.0
info:
  title: Service catalogue
  version: 0.1.0
paths:
  /health:
    get:
      tags:
      - santé
      summary: État de l'instance, appelé par Consul toutes les 10 s
      operationId: sante
      responses:
        '200':
          description: L'instance et sa base répondent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sante'
        '503':
          description: La base de données ne répond pas.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Probleme'
  /api/v1/events:
    get:
      tags:
      - événements
      summary: Rechercher les événements, page par page (route publique)
      description: Filtres facultatifs et cumulables. q cherche dans le nom et la description ;
        ville, du et au retiennent les événements qui ont au moins une séance dans cette ville et
        dans cet intervalle (bornes incluses). Ordre stable par date de création croissante, puis
        identifiant.
      operationId: listerEvenements
      parameters:
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 100
            minLength: 1
          - type: 'null'
          title: Q
      - name: ville
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 100
            minLength: 1
          - type: 'null'
          title: Ville
      - name: du
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Du
      - name: au
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Au
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          title: Page
          default: 1
      - name: size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          title: Size
          default: 20
      responses:
        '200':
          description: Page d'événements (depuis le cache Redis si la base ne répond pas).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvenementPage'
        '422':
          description: Filtres ou pagination invalides, ou du postérieur à au (REQUETE_INVALIDE).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Probleme'
        '503':
          description: Base injoignable et données absentes du cache (BASE_INDISPONIBLE).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Probleme'
    post:
      tags:
      - événements
      summary: Créer un événement (scope events:write ; admin)
      operationId: creerEvenement
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvenementCreation'
        required: true
      responses:
        '201':
          description: Événement créé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evenement'
        '401':
          description: Jeton absent, invalide ou expiré (JETON_*).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Probleme'
        '403':
          description: Rôle ou scope manquant (ROLE_MANQUANT, SCOPE_MANQUANT).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Probleme'
        '422':
          description: Corps invalide (REQUETE_INVALIDE).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Probleme'
      security:
      - HTTPBearer: []
  /api/v1/events/{evenement_id}:
    get:
      tags:
      - événements
      summary: Lire le détail d'un événement (route publique)
      operationId: lireEvenement
      parameters:
      - name: evenement_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Evenement Id
      responses:
        '200':
          description: Détail de l'événement (depuis le cache Redis si la base ne répond pas).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evenement'
        '404':
          description: Aucun événement avec cet identifiant (EVENT_NOT_FOUND).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Probleme'
        '422':
          description: Identifiant invalide (REQUETE_INVALIDE).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Probleme'
        '503':
          description: Base injoignable et donnée absente du cache (BASE_INDISPONIBLE).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Probleme'
  /api/v1/events/{evenement_id}/shows:
    get:
      tags:
      - séances
      summary: Lister les séances d'un événement avec leurs catégories, page par page (route
        publique)
      description: Ordre stable par début croissant, puis identifiant.
      operationId: listerSeances
      parameters:
      - name: evenement_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Evenement Id
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          title: Page
          default: 1
      - name: size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          title: Size
          default: 20
      responses:
        '200':
          description: Page de séances (depuis le cache Redis si la base ne répond pas).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeancePage'
        '404':
          description: Aucun événement avec cet identifiant (EVENT_NOT_FOUND).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Probleme'
        '422':
          description: Identifiant ou paramètres de pagination invalides (REQUETE_INVALIDE).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Probleme'
        '503':
          description: Base injoignable et données absentes du cache (BASE_INDISPONIBLE).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Probleme'
    post:
      tags:
      - séances
      summary: Programmer une séance dans un lieu, avec ses catégories de places (scope
        events:write ; admin)
      description: Publie ticketing.show.scheduled, qui porte aussi le nom de l'événement, le nom
        et la ville du lieu.
      operationId: creerSeance
      security:
      - HTTPBearer: []
      parameters:
      - name: evenement_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Evenement Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeanceCreation'
      responses:
        '201':
          description: Séance créée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Seance'
        '401':
          description: Jeton absent, invalide ou expiré (JETON_*).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Probleme'
        '403':
          description: Rôle ou scope manquant (ROLE_MANQUANT, SCOPE_MANQUANT).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Probleme'
        '404':
          description: Événement ou lieu inconnu (EVENT_NOT_FOUND, VENUE_NOT_FOUND).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Probleme'
        '422':
          description: Identifiant ou corps invalide (REQUETE_INVALIDE), début dans le passé
            (SHOW_START_IN_PAST) ou même rang deux fois dans la séance, dans une même catégorie
            ou dans deux (ROW_ALREADY_ASSIGNED).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Probleme'
  /api/v1/events/{evenement_id}/shows/{seance_id}:
    get:
      tags:
      - séances
      summary: Lire une séance avec ses catégories de places (route publique)
      operationId: lireSeance
      parameters:
      - name: evenement_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Evenement Id
      - name: seance_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Seance Id
      responses:
        '200':
          description: Séance (depuis le cache Redis si la base ne répond pas).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Seance'
        '404':
          description: Événement ou séance inconnu (EVENT_NOT_FOUND, SHOW_NOT_FOUND).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Probleme'
        '422':
          description: Identifiant invalide (REQUETE_INVALIDE).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Probleme'
        '503':
          description: Base injoignable et donnée absente du cache (BASE_INDISPONIBLE).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Probleme'
  /api/v1/events/{evenement_id}/shows/{seance_id}/cancellation:
    post:
      tags:
      - séances
      summary: Annuler une séance (scope events:write ; admin)
      description: Publie ticketing.show.cancelled ; toutes les commandes de la séance sont
        remboursées automatiquement (règle métier 5) et ses billets annulés.
      operationId: annulerSeance
      security:
      - HTTPBearer: []
      parameters:
      - name: evenement_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Evenement Id
      - name: seance_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Seance Id
      responses:
        '200':
          description: Séance annulée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Seance'
        '401':
          description: Jeton absent, invalide ou expiré (JETON_*).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Probleme'
        '403':
          description: Rôle ou scope manquant (ROLE_MANQUANT, SCOPE_MANQUANT).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Probleme'
        '404':
          description: Événement ou séance inconnu (EVENT_NOT_FOUND, SHOW_NOT_FOUND).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Probleme'
        '409':
          description: La séance est déjà annulée (SHOW_ALREADY_CANCELLED) ou déjà commencée
            (SHOW_ALREADY_STARTED).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Probleme'
        '422':
          description: Identifiant invalide (REQUETE_INVALIDE).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Probleme'
  /api/v1/shows/{seance_id}:
    get:
      tags:
      - séances
      summary: Lire une séance par son seul identifiant, avec ses catégories de places (route
        publique)
      description: Utilisée notamment par Commandes, qui ne connaît que la séance de la commande.
      operationId: lireSeanceParId
      parameters:
      - name: seance_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Seance Id
      responses:
        '200':
          description: Séance (depuis le cache Redis si la base ne répond pas).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Seance'
        '404':
          description: Aucune séance avec cet identifiant (SHOW_NOT_FOUND).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Probleme'
        '422':
          description: Identifiant invalide (REQUETE_INVALIDE).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Probleme'
        '503':
          description: Base injoignable et donnée absente du cache (BASE_INDISPONIBLE).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Probleme'
  /api/v1/venues:
    get:
      tags:
      - lieux
      summary: Lister les lieux, page par page (route publique)
      description: Ordre stable par date de création croissante, puis identifiant.
      operationId: listerLieux
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          title: Page
          default: 1
      - name: size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          title: Size
          default: 20
      responses:
        '200':
          description: Page de lieux (depuis le cache Redis si la base ne répond pas).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LieuPage'
        '422':
          description: Paramètres de pagination invalides (REQUETE_INVALIDE).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Probleme'
        '503':
          description: Base injoignable et données absentes du cache (BASE_INDISPONIBLE).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Probleme'
    post:
      tags:
      - lieux
      summary: Créer un lieu (scope events:write ; admin)
      operationId: creerLieu
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LieuCreation'
        required: true
      responses:
        '201':
          description: Lieu créé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lieu'
        '401':
          description: Jeton absent, invalide ou expiré (JETON_*).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Probleme'
        '403':
          description: Rôle ou scope manquant (ROLE_MANQUANT, SCOPE_MANQUANT).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Probleme'
        '422':
          description: Corps invalide (REQUETE_INVALIDE).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Probleme'
      security:
      - HTTPBearer: []
  /api/v1/venues/{lieu_id}:
    get:
      tags:
      - lieux
      summary: Lire un lieu (route publique)
      operationId: lireLieu
      parameters:
      - name: lieu_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Lieu Id
      responses:
        '200':
          description: Lieu (depuis le cache Redis si la base ne répond pas).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lieu'
        '404':
          description: Aucun lieu avec cet identifiant (VENUE_NOT_FOUND).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Probleme'
        '422':
          description: Identifiant invalide (REQUETE_INVALIDE).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Probleme'
        '503':
          description: Base injoignable et donnée absente du cache (BASE_INDISPONIBLE).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Probleme'
components:
  schemas:
    EvenementCreation:
      properties:
        nom:
          type: string
          maxLength: 200
          minLength: 1
          title: Nom
        description:
          type: string
          maxLength: 5000
          title: Description
      type: object
      required:
      - nom
      - description
      title: EvenementCreation
    Evenement:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        nom:
          type: string
          title: Nom
        description:
          type: string
          title: Description
        cree_le:
          type: string
          format: date-time
          title: Cree Le
      type: object
      required:
      - id
      - nom
      - description
      - cree_le
      title: Evenement
    EvenementPage:
      properties:
        elements:
          items:
            $ref: '#/components/schemas/Evenement'
          type: array
          title: Elements
        page:
          type: integer
          title: Page
        size:
          type: integer
          title: Size
        total:
          type: integer
          title: Total
          description: Nombre total d'événements qui répondent aux filtres.
      type: object
      required:
      - elements
      - page
      - size
      - total
      title: EvenementPage
    CategorieCreation:
      properties:
        nom:
          type: string
          maxLength: 100
          minLength: 1
          title: Nom
        prix:
          type: integer
          exclusiveMinimum: 0
          title: Prix
          description: Prix d'une place de la catégorie, en centimes.
        rangs:
          items:
            $ref: '#/components/schemas/Rang'
          type: array
          maxItems: 100
          minItems: 1
          title: Rangs
          description: Rangs de la catégorie ; un rang n'apparaît qu'une fois dans la séance, ni
            en double dans la catégorie ni dans une autre catégorie (sinon ROW_ALREADY_ASSIGNED).
      type: object
      required:
      - nom
      - prix
      - rangs
      title: CategorieCreation
    Rang:
      properties:
        rang:
          type: string
          maxLength: 10
          minLength: 1
          title: Rang
        nombre_places:
          type: integer
          maximum: 1000
          minimum: 1
          title: Nombre Places
          description: Places numérotées de 1 à nombre_places dans le rang.
      type: object
      required:
      - rang
      - nombre_places
      title: Rang
    Categorie:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        nom:
          type: string
          title: Nom
        prix:
          type: integer
          title: Prix
          description: Prix d'une place de la catégorie, en centimes.
        rangs:
          items:
            $ref: '#/components/schemas/Rang'
          type: array
          title: Rangs
      type: object
      required:
      - id
      - nom
      - prix
      - rangs
      title: Categorie
    SeanceCreation:
      properties:
        lieu_id:
          type: string
          format: uuid
          title: Lieu Id
        debut:
          type: string
          format: date-time
          title: Debut
          description: Doit être dans le futur (sinon SHOW_START_IN_PAST).
        categories:
          items:
            $ref: '#/components/schemas/CategorieCreation'
          type: array
          maxItems: 20
          minItems: 1
          title: Categories
          description: Catégories de places tarifées de la séance.
      type: object
      required:
      - lieu_id
      - debut
      - categories
      title: SeanceCreation
    Seance:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        evenement_id:
          type: string
          format: uuid
          title: Evenement Id
        lieu_id:
          type: string
          format: uuid
          title: Lieu Id
        debut:
          type: string
          format: date-time
          title: Debut
        annulee:
          type: boolean
          title: Annulee
          description: Vrai une fois la séance annulée (ticketing.show.cancelled publié).
        categories:
          items:
            $ref: '#/components/schemas/Categorie'
          type: array
          title: Categories
      type: object
      required:
      - id
      - evenement_id
      - lieu_id
      - debut
      - annulee
      - categories
      title: Seance
    SeancePage:
      properties:
        elements:
          items:
            $ref: '#/components/schemas/Seance'
          type: array
          title: Elements
        page:
          type: integer
          title: Page
        size:
          type: integer
          title: Size
        total:
          type: integer
          title: Total
          description: Nombre total de séances de l'événement.
      type: object
      required:
      - elements
      - page
      - size
      - total
      title: SeancePage
    LieuCreation:
      properties:
        nom:
          type: string
          maxLength: 200
          minLength: 1
          title: Nom
        adresse:
          type: string
          maxLength: 300
          minLength: 1
          title: Adresse
        ville:
          type: string
          maxLength: 100
          minLength: 1
          title: Ville
      type: object
      required:
      - nom
      - adresse
      - ville
      title: LieuCreation
    Lieu:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        nom:
          type: string
          title: Nom
        adresse:
          type: string
          title: Adresse
        ville:
          type: string
          title: Ville
        cree_le:
          type: string
          format: date-time
          title: Cree Le
      type: object
      required:
      - id
      - nom
      - adresse
      - ville
      - cree_le
      title: Lieu
    LieuPage:
      properties:
        elements:
          items:
            $ref: '#/components/schemas/Lieu'
          type: array
          title: Elements
        page:
          type: integer
          title: Page
        size:
          type: integer
          title: Size
        total:
          type: integer
          title: Total
          description: Nombre total de lieux.
      type: object
      required:
      - elements
      - page
      - size
      - total
      title: LieuPage
    Probleme:
      properties:
        type:
          type: string
          title: Type
          default: about:blank
        title:
          type: string
          title: Title
        status:
          type: integer
          title: Status
        detail:
          type: string
          title: Detail
        code:
          type: string
          title: Code
          description: Code métier stable, par exemple ECHO_INTROUVABLE.
        correlation_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Correlation Id
          description: Identifiant de corrélation de la requête (X-Correlation-Id).
        erreurs:
          anyOf:
          - items:
              additionalProperties: true
              type: object
            type: array
          - type: 'null'
          title: Erreurs
          description: Détail des champs invalides (code REQUETE_INVALIDE).
      type: object
      required:
      - title
      - status
      - detail
      - code
      title: Probleme
    Sante:
      properties:
        statut:
          type: string
          title: Statut
          examples:
          - ok
      type: object
      required:
      - statut
      title: Sante
  securitySchemes:
    HTTPBearer:
      type: http
      description: Jeton d'accès Keycloak du realm billetterie.
      scheme: bearer
