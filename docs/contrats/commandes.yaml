# Contrat OpenAPI 3.1 cible du service commandes (BIL-002) : la référence des tickets US.
# Chaque ticket US recopie ses routes dans services/commandes/openapi.yaml avec le code ;
# ce fichier-ci est seulement validé (openapi-spec-validator), pas comparé au code.
# L'expiration d'une commande non payée n'a pas de route : elle publie ticketing.order.expired.
openapi: 3.1.0
info:
  title: Service commandes
  version: 0.1.0
paths:
  /health:
    get:
      tags:
      - santé
      summary: État de l'instance, appelé par Consul toutes les 10 s
      operationId: sante
      responses:
        '200':
          description: L'instance et sa base répondent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sante'
        '503':
          description: La base de données ne répond pas.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Probleme'
  /api/v1/orders:
    post:
      tags:
      - commandes
      summary: Commander des places d'une séance et payer (scope orders:write ; client et
        revendeur)
      description: >-
        Crée d'abord la commande EN_ATTENTE, puis verrouille chaque place auprès de Billets
        en durée de réservation (prix de chaque ligne lu dans la catégorie de la place) ; un
        échec de verrou passe la commande EXPIREE et publie ticketing.order.expired, qui libère
        les places déjà verrouillées. Juste avant Paiements, les places sont reverrouillées en
        durée de confirmation ; une place perdue donne 409 SEAT_ALREADY_TAKEN, la commande
        passe EXPIREE, sans aucun débit. Paiement accepté, la commande est confirmée et
        ticketing.order.confirmed est publié. La commande appartient à l'appelant du jeton.
      operationId: creerCommande
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: Idempotency-Key
        description: Facultatif ; une requête terminée, rejouée avec la même clé par le même
          appelant, répond 200 avec la commande déjà créée ; rejouée pendant que la première
          est en cours, elle répond 409 REQUEST_IN_PROGRESS.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommandeCreation'
        required: true
      responses:
        '200':
          description: Rejeu d'une requête terminée avec la même Idempotency-Key par le même
            appelant ; commande déjà créée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Commande'
        '201':
          description: Commande créée et payée (statut CONFIRMEE).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Commande'
        '401':
          description: Jeton absent, invalide ou expiré (JETON_*).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Probleme'
        '402':
          description: Paiement refusé ; la commande expire et ses places sont libérées
            (PAYMENT_REFUSED).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Probleme'
        '403':
          description: Rôle ou scope manquant (ROLE_MANQUANT, SCOPE_MANQUANT).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Probleme'
        '404':
          description: Séance inconnue (SHOW_NOT_FOUND) ou place inconnue dans cette séance
            (SEAT_NOT_FOUND).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Probleme'
        '409':
          description: Place déjà prise (SEAT_ALREADY_TAKEN), nombre maximal de billets par séance
            dépassé pour l'appelant (TICKET_LIMIT_EXCEEDED), séance annulée (SHOW_CANCELLED) ou
            déjà commencée (SHOW_ALREADY_STARTED), ou requête de même Idempotency-Key encore en
            cours (REQUEST_IN_PROGRESS).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Probleme'
        '422':
          description: En-tête ou corps invalide (REQUETE_INVALIDE).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Probleme'
        '503':
          description: Billets, Catalogue ou Paiements indisponible (SERVICE_INDISPONIBLE). Si
            Paiements ne répond pas, la commande reste EN_ATTENTE, ses places verrouillées
            jusqu'à expire_le ; elle se retrouve par listerCommandes et se paie par payerCommande.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Probleme'
      security:
      - HTTPBearer: []
    get:
      tags:
      - commandes
      summary: Lister mes commandes, page par page (scope orders:read ; client et revendeur)
      description: Filtré par l'appelant du jeton, jamais par un paramètre (règle métier 6).
        Ordre stable par date de création décroissante, puis identifiant.
      operationId: listerCommandes
      security:
      - HTTPBearer: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          title: Page
          default: 1
      - name: size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          title: Size
          default: 20
      responses:
        '200':
          description: Page des commandes de l'appelant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandePage'
        '401':
          description: Jeton absent, invalide ou expiré (JETON_*).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Probleme'
        '403':
          description: Rôle ou scope manquant (ROLE_MANQUANT, SCOPE_MANQUANT).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Probleme'
        '422':
          description: Paramètres de pagination invalides (REQUETE_INVALIDE).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Probleme'
  /api/v1/orders/{commande_id}:
    get:
      tags:
      - commandes
      summary: Suivre une de mes commandes (scope orders:read ; client et revendeur)
      operationId: lireCommande
      security:
      - HTTPBearer: []
      parameters:
      - name: commande_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Commande Id
      responses:
        '200':
          description: Commande de l'appelant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Commande'
        '401':
          description: Jeton absent, invalide ou expiré (JETON_*).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Probleme'
        '403':
          description: Rôle ou scope manquant (ROLE_MANQUANT, SCOPE_MANQUANT).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Probleme'
        '404':
          description: Aucune commande de l'appelant avec cet identifiant (ORDER_NOT_FOUND).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Probleme'
        '422':
          description: Identifiant invalide (REQUETE_INVALIDE).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Probleme'
  /api/v1/orders/{commande_id}/payment:
    post:
      tags:
      - commandes
      summary: Réessayer le paiement d'une de mes commandes en attente (scope orders:write ;
        client et revendeur)
      description: >-
        Nouvel essai après un 503 de Paiements, tant que la commande est EN_ATTENTE (avant
        expire_le). Juste avant Paiements, les places sont reverrouillées en durée de
        confirmation ; une place perdue donne 409 SEAT_ALREADY_TAKEN, la commande passe
        EXPIREE, sans aucun débit. Paiement accepté, la commande est confirmée et
        ticketing.order.confirmed est publié.
      operationId: payerCommande
      security:
      - HTTPBearer: []
      parameters:
      - name: commande_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Commande Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaiementCommande'
      responses:
        '200':
          description: Commande payée (statut CONFIRMEE).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Commande'
        '401':
          description: Jeton absent, invalide ou expiré (JETON_*).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Probleme'
        '402':
          description: Paiement refusé ; la commande expire et ses places sont libérées
            (PAYMENT_REFUSED).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Probleme'
        '403':
          description: Rôle ou scope manquant (ROLE_MANQUANT, SCOPE_MANQUANT).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Probleme'
        '404':
          description: Aucune commande de l'appelant avec cet identifiant (ORDER_NOT_FOUND).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Probleme'
        '409':
          description: La commande n'est pas EN_ATTENTE (ORDER_NOT_PENDING), une place est perdue
            (SEAT_ALREADY_TAKEN ; la commande passe EXPIREE, sans débit), ou sa séance est annulée
            (SHOW_CANCELLED) ou déjà commencée (SHOW_ALREADY_STARTED).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Probleme'
        '422':
          description: Identifiant ou corps invalide (REQUETE_INVALIDE).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Probleme'
        '503':
          description: Catalogue (lecture de la séance) ou Paiements indisponible ; la commande
            reste EN_ATTENTE jusqu'à expire_le (SERVICE_INDISPONIBLE).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Probleme'
components:
  schemas:
    CommandeCreation:
      properties:
        seance_id:
          type: string
          format: uuid
          title: Seance Id
        place_ids:
          items:
            type: string
            format: uuid
          type: array
          maxItems: 10
          minItems: 1
          uniqueItems: true
          title: Place Ids
        carte_test:
          type: string
          pattern: ^[0-9]{16}$
          title: Carte Test
          description: 'Numéro de carte du paiement simulé, transmis à Paiements et jamais
            journalisé. Numéros de test : 4000000000000002 refusé (PAYMENT_REFUSED), tout autre
            numéro de 16 chiffres accepté (par exemple 4242424242424242).'
      type: object
      required:
      - seance_id
      - place_ids
      - carte_test
      title: CommandeCreation
    PaiementCommande:
      properties:
        carte_test:
          type: string
          pattern: ^[0-9]{16}$
          title: Carte Test
          description: 'Numéro de carte du paiement simulé, transmis à Paiements et jamais
            journalisé. Numéros de test : 4000000000000002 refusé (PAYMENT_REFUSED), tout autre
            numéro de 16 chiffres accepté (par exemple 4242424242424242).'
      type: object
      required:
      - carte_test
      title: PaiementCommande
    StatutCommande:
      type: string
      enum:
      - EN_ATTENTE
      - CONFIRMEE
      - EXPIREE
      - REMBOURSEE
      title: StatutCommande
      description: >-
        Transitions autorisées : EN_ATTENTE vers CONFIRMEE ou EXPIREE ; CONFIRMEE vers
        REMBOURSEE ; EXPIREE et REMBOURSEE sont finales.
        EXPIREE : non payée avant expire_le, paiement refusé, échec de verrou ou place
        perdue avant paiement, ou séance annulée alors que la commande était EN_ATTENTE
        (ticketing.show.cancelled). REMBOURSEE : remboursement après ticketing.show.cancelled
        ou ticketing.ticket.rejected (place refusée à l'émission du billet), reçu par
        ticketing.payment.refunded.
    LigneCommande:
      properties:
        place_id:
          type: string
          format: uuid
          title: Place Id
        montant:
          type: integer
          title: Montant
          description: Prix de la place en centimes (catégorie de la place au moment de la
            commande).
      type: object
      required:
      - place_id
      - montant
      title: LigneCommande
    Commande:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        seance_id:
          type: string
          format: uuid
          title: Seance Id
        lignes:
          items:
            $ref: '#/components/schemas/LigneCommande'
          type: array
          title: Lignes
        statut:
          $ref: '#/components/schemas/StatutCommande'
        montant_total:
          type: integer
          title: Montant Total
          description: Somme des montants des lignes, en centimes.
        cree_le:
          type: string
          format: date-time
          title: Cree Le
        expire_le:
          type: string
          format: date-time
          title: Expire Le
          description: Fin du plus court des verrous de ses places (réservation de 10 minutes par
            défaut, configurable ; confirmation de 1 h juste avant Paiements) ; une commande
            encore EN_ATTENTE à cette date devient EXPIREE.
      type: object
      required:
      - id
      - seance_id
      - lignes
      - statut
      - montant_total
      - cree_le
      - expire_le
      title: Commande
    CommandePage:
      properties:
        elements:
          items:
            $ref: '#/components/schemas/Commande'
          type: array
          title: Elements
        page:
          type: integer
          title: Page
        size:
          type: integer
          title: Size
        total:
          type: integer
          title: Total
          description: Nombre total de commandes de l'appelant.
      type: object
      required:
      - elements
      - page
      - size
      - total
      title: CommandePage
    Probleme:
      properties:
        type:
          type: string
          title: Type
          default: about:blank
        title:
          type: string
          title: Title
        status:
          type: integer
          title: Status
        detail:
          type: string
          title: Detail
        code:
          type: string
          title: Code
          description: Code métier stable, par exemple ECHO_INTROUVABLE.
        correlation_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Correlation Id
          description: Identifiant de corrélation de la requête (X-Correlation-Id).
        erreurs:
          anyOf:
          - items:
              additionalProperties: true
              type: object
            type: array
          - type: 'null'
          title: Erreurs
          description: Détail des champs invalides (code REQUETE_INVALIDE).
      type: object
      required:
      - title
      - status
      - detail
      - code
      title: Probleme
    Sante:
      properties:
        statut:
          type: string
          title: Statut
          examples:
          - ok
      type: object
      required:
      - statut
      title: Sante
  securitySchemes:
    HTTPBearer:
      type: http
      description: Jeton d'accès Keycloak du realm billetterie.
      scheme: bearer
