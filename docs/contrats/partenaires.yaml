# Contrat OpenAPI 3.1 de l'API des revendeurs partenaires (BIL-012) : documentation publiée
# séparément. Aucune route propre : c'est le sous-ensemble des routes de Catalogue, Billets et
# Commandes ouvert au rôle partner (conception, section « API partenaires et lots »), recopié
# opération par opération depuis services/<service>/openapi.yaml, plus la réponse 429 de la
# gateway (chaîne Traefik partenaires@file, quota par jeton). Une opération d'ici doit rester
# identique à celle du service, 429 en plus.
# Lecture des billets (listerBillets, lireBillet) : ajoutée au ticket BIL-021, recopiée de
# services/billets/openapi.yaml.
openapi: 3.1.0
info:
  title: API des revendeurs partenaires
  version: 0.1.0
  description: >-
    API de la billetterie ouverte aux revendeurs partenaires. Authentification par le flux OAuth
    2.0 Client Credentials uniquement : POST /auth/realms/billetterie/protocol/openid-connect/token
    avec grant_type=client_credentials, client_id et client_secret du revendeur ; le jeton porte
    le rôle partner et les scopes events:read, orders:read, orders:write et tickets:read. Le jeton
    se passe dans l'en-tête Authorization: Bearer. Un revendeur ne voit que ses propres
    commandes et ses propres billets : ils sont filtrés par le client du jeton, jamais par un
    paramètre. Chaque
    revendeur a son propre quota de requêtes, compté par jeton ; au-delà, la gateway répond 429.
paths:
  /api/v1/events:
    get:
      tags:
      - événements
      summary: Rechercher les événements, page par page (route publique)
      description: Filtres facultatifs et cumulables. q cherche dans le nom et la description ;
        ville, du et au retiennent les événements qui ont au moins une séance dans cette ville et
        dans cet intervalle (bornes incluses). Ordre stable par date de création croissante, puis
        identifiant.
      operationId: listerEvenements
      parameters:
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 100
            minLength: 1
          - type: 'null'
          title: Q
      - name: ville
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 100
            minLength: 1
          - type: 'null'
          title: Ville
      - name: du
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Du
      - name: au
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Au
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          title: Page
          default: 1
      - name: size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          title: Size
          default: 20
      responses:
        '200':
          description: Page d'événements (depuis le cache Redis si la base ne répond pas).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvenementPage'
          headers:
            X-Cache-Stale:
              description: Présent, valeur true, seulement quand la réponse vient du cache Redis
                parce que la base ne répond pas (mode dégradé) ; absent sinon.
              schema:
                type: string
                enum:
                - 'true'
        '422':
          description: Filtres ou pagination invalides, ou du postérieur à au (REQUETE_INVALIDE).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Probleme'
        '429':
          $ref: '#/components/responses/QuotaDepasse'
        '503':
          description: Base injoignable et données absentes du cache (BASE_INDISPONIBLE).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Probleme'
  /api/v1/events/{evenement_id}:
    get:
      tags:
      - événements
      summary: Lire le détail d'un événement (route publique)
      operationId: lireEvenement
      parameters:
      - name: evenement_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Evenement Id
      responses:
        '200':
          description: Détail de l'événement (depuis le cache Redis si la base ne répond pas).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evenement'
          headers:
            X-Cache-Stale:
              description: Présent, valeur true, seulement quand la réponse vient du cache Redis
                parce que la base ne répond pas (mode dégradé) ; absent sinon.
              schema:
                type: string
                enum:
                - 'true'
        '404':
          description: Aucun événement avec cet identifiant (EVENT_NOT_FOUND).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Probleme'
        '422':
          description: Identifiant invalide (REQUETE_INVALIDE).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Probleme'
        '429':
          $ref: '#/components/responses/QuotaDepasse'
        '503':
          description: Base injoignable et donnée absente du cache (BASE_INDISPONIBLE).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Probleme'
  /api/v1/events/{evenement_id}/shows:
    get:
      tags:
      - séances
      summary: Lister les séances d'un événement avec leurs catégories, page par page (route
        publique)
      description: Ordre stable par début croissant, puis identifiant.
      operationId: listerSeances
      parameters:
      - name: evenement_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Evenement Id
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          title: Page
          default: 1
      - name: size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          title: Size
          default: 20
      responses:
        '200':
          description: Page de séances (depuis le cache Redis si la base ne répond pas).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeancePage'
          headers:
            X-Cache-Stale:
              description: Présent, valeur true, seulement quand la réponse vient du cache Redis
                parce que la base ne répond pas (mode dégradé) ; absent sinon.
              schema:
                type: string
                enum:
                - 'true'
        '404':
          description: Aucun événement avec cet identifiant (EVENT_NOT_FOUND).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Probleme'
        '422':
          description: Identifiant ou paramètres de pagination invalides (REQUETE_INVALIDE).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Probleme'
        '429':
          $ref: '#/components/responses/QuotaDepasse'
        '503':
          description: Base injoignable et données absentes du cache (BASE_INDISPONIBLE).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Probleme'
  /api/v1/events/{evenement_id}/shows/{seance_id}:
    get:
      tags:
      - séances
      summary: Lire une séance avec ses catégories de places (route publique)
      operationId: lireSeance
      parameters:
      - name: evenement_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Evenement Id
      - name: seance_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Seance Id
      responses:
        '200':
          description: Séance (depuis le cache Redis si la base ne répond pas).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Seance'
          headers:
            X-Cache-Stale:
              description: Présent, valeur true, seulement quand la réponse vient du cache Redis
                parce que la base ne répond pas (mode dégradé) ; absent sinon.
              schema:
                type: string
                enum:
                - 'true'
        '404':
          description: Événement ou séance inconnu (EVENT_NOT_FOUND, SHOW_NOT_FOUND).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Probleme'
        '422':
          description: Identifiant invalide (REQUETE_INVALIDE).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Probleme'
        '429':
          $ref: '#/components/responses/QuotaDepasse'
        '503':
          description: Base injoignable et donnée absente du cache (BASE_INDISPONIBLE).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Probleme'
  /api/v1/shows/{seance_id}:
    get:
      tags:
      - séances
      summary: Lire une séance par son seul identifiant, avec ses catégories de places (route
        publique)
      description: Utilisée notamment par Commandes, qui ne connaît que la séance de la commande.
      operationId: lireSeanceParId
      parameters:
      - name: seance_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Seance Id
      responses:
        '200':
          description: Séance (depuis le cache Redis si la base ne répond pas).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Seance'
          headers:
            X-Cache-Stale:
              description: Présent, valeur true, seulement quand la réponse vient du cache Redis
                parce que la base ne répond pas (mode dégradé) ; absent sinon.
              schema:
                type: string
                enum:
                - 'true'
        '404':
          description: Aucune séance avec cet identifiant (SHOW_NOT_FOUND).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Probleme'
        '422':
          description: Identifiant invalide (REQUETE_INVALIDE).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Probleme'
        '429':
          $ref: '#/components/responses/QuotaDepasse'
        '503':
          description: Base injoignable et donnée absente du cache (BASE_INDISPONIBLE).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Probleme'
  /api/v1/venues:
    get:
      tags:
      - lieux
      summary: Lister les lieux, page par page (route publique)
      description: Ordre stable par date de création croissante, puis identifiant.
      operationId: listerLieux
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          title: Page
          default: 1
      - name: size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          title: Size
          default: 20
      responses:
        '200':
          description: Page de lieux (depuis le cache Redis si la base ne répond pas).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LieuPage'
          headers:
            X-Cache-Stale:
              description: Présent, valeur true, seulement quand la réponse vient du cache Redis
                parce que la base ne répond pas (mode dégradé) ; absent sinon.
              schema:
                type: string
                enum:
                - 'true'
        '422':
          description: Paramètres de pagination invalides (REQUETE_INVALIDE).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Probleme'
        '429':
          $ref: '#/components/responses/QuotaDepasse'
        '503':
          description: Base injoignable et données absentes du cache (BASE_INDISPONIBLE).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Probleme'
  /api/v1/venues/{lieu_id}:
    get:
      tags:
      - lieux
      summary: Lire un lieu (route publique)
      operationId: lireLieu
      parameters:
      - name: lieu_id
        in: path
        required: true
