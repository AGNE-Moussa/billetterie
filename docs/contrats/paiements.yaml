# Contrat OpenAPI 3.1 cible du service paiements (BIL-002) : la référence des tickets US.
# Chaque ticket US recopie ses routes dans services/paiements/openapi.yaml avec le code ;
# ce fichier-ci est seulement validé (openapi-spec-validator), pas comparé au code.
# Le remboursement n'a pas de route : il vit dans les consommateurs de ticketing.show.cancelled
# et de ticketing.ticket.rejected (remboursement de la commande, seulement si son paiement est
# ACCEPTE, un seul ticketing.payment.refunded par paiement) et publie ticketing.payment.refunded.
openapi: 3.1.0
info:
  title: Service paiements
  version: 0.1.0
paths:
  /health:
    get:
      tags:
      - santé
      summary: État de l'instance, appelé par Consul toutes les 10 s
      operationId: sante
      responses:
        '200':
          description: L'instance et sa base répondent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sante'
        '503':
          description: La base de données ne répond pas.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Probleme'
  /api/v1/payments:
    post:
      tags:
      - paiements
      summary: Payer une commande en mode test (scope payments:write ; client services seulement)
      description: Paiement simulé, aucune donnée de carte réelle ; le numéro de carte n'est ni
        journalisé ni conservé. Un seul paiement par commande. Idempotent par Idempotency-Key
        (égal à commande_id) ; une requête rejouée à l'identique renvoie le résultat enregistré
        (201 ou 402), sans nouveau paiement.
      operationId: creerPaiement
      security:
      - HTTPBearer: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
          title: Idempotency-Key
        description: Identifiant de la commande payée (même valeur que commande_id).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaiementCreation'
      responses:
        '201':
          description: Paiement accepté (statut ACCEPTE).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Paiement'
        '401':
          description: Jeton absent, invalide ou expiré (JETON_*).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Probleme'
        '402':
          description: Paiement refusé, enregistré avec le statut REFUSE (PAYMENT_REFUSED).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Probleme'
        '403':
          description: Rôle ou scope manquant (ROLE_MANQUANT, SCOPE_MANQUANT).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Probleme'
        '409':
          description: Un paiement différent existe déjà pour cette commande
            (PAYMENT_ALREADY_EXISTS), ou la séance est annulée d'après la projection des séances
            annulées (SHOW_CANCELLED).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Probleme'
        '422':
          description: En-tête ou corps invalide, ou Idempotency-Key différent de commande_id
            (REQUETE_INVALIDE).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Probleme'
components:
  schemas:
    PaiementCreation:
      properties:
        commande_id:
          type: string
          format: uuid
          title: Commande Id
        seance_id:
          type: string
          format: uuid
          title: Seance Id
          description: Séance de la commande ; Paiements consomme ticketing.show.cancelled et
            rembourse les paiements ACCEPTE de la séance.
        montant:
          type: integer
          exclusiveMinimum: 0
          title: Montant
          description: Montant en centimes.
        carte_test:
          type: string
          pattern: ^[0-9]{16}$
          title: Carte Test
          description: 'Numéro de carte du paiement simulé, jamais journalisé. Numéros de test :
            4000000000000002 refusé (PAYMENT_REFUSED), tout autre numéro de 16 chiffres accepté
            (par exemple 4242424242424242).'
      type: object
      required:
      - commande_id
      - seance_id
      - montant
      - carte_test
      title: PaiementCreation
    StatutPaiement:
      type: string
      enum:
      - ACCEPTE
      - REFUSE
      - REMBOURSE
      title: StatutPaiement
    Paiement:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        commande_id:
          type: string
          format: uuid
          title: Commande Id
        seance_id:
          type: string
          format: uuid
          title: Seance Id
          description: Séance de la commande ; Paiements consomme ticketing.show.cancelled et
            rembourse les paiements ACCEPTE de la séance.
        montant:
          type: integer
          title: Montant
          description: Montant en centimes.
        statut:
          $ref: '#/components/schemas/StatutPaiement'
        cree_le:
          type: string
          format: date-time
          title: Cree Le
      type: object
      required:
      - id
      - commande_id
      - seance_id
      - montant
      - statut
      - cree_le
      title: Paiement
    Probleme:
      properties:
        type:
          type: string
          title: Type
          default: about:blank
        title:
          type: string
          title: Title
        status:
          type: integer
          title: Status
        detail:
          type: string
          title: Detail
        code:
          type: string
          title: Code
          description: Code métier stable, par exemple ECHO_INTROUVABLE.
        correlation_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Correlation Id
          description: Identifiant de corrélation de la requête (X-Correlation-Id).
        erreurs:
          anyOf:
          - items:
              additionalProperties: true
              type: object
            type: array
          - type: 'null'
          title: Erreurs
          description: Détail des champs invalides (code REQUETE_INVALIDE).
      type: object
      required:
      - title
      - status
      - detail
      - code
      title: Probleme
    Sante:
      properties:
        statut:
          type: string
          title: Statut
          examples:
          - ok
      type: object
      required:
      - statut
      title: Sante
  securitySchemes:
    HTTPBearer:
      type: http
      description: Jeton d'accès Keycloak du realm billetterie.
      scheme: bearer
