name: Déploiement

# Déploiement de la démo (BIL-F29), lancé à la main depuis l'onglet Actions, branche main.
# Sans entrée : construit et publie les images du commit (sha-<commit>), puis les déploie.
# Avec l'entrée tag (un ancien sha-<commit>) : aucune construction, ce tag est redéployé
# (retour arrière).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag déjà publié à redéployer (sha-<commit>) ; vide : construire le commit"
        required: false
        default: ""
        type: string

# Un seul déploiement à la fois, jamais annulé en cours de route.
concurrency:
  group: deploiement-demo
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  images:
    name: images (${{ matrix.image }})
    if: github.ref == 'refs/heads/main' && inputs.tag == ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: echo
            context: .
            dockerfile: services/echo/Dockerfile
          - image: verificateur
            context: .
            dockerfile: infra/verificateur/Dockerfile
          - image: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
          - image: catalogue
            context: .
            dockerfile: services/catalogue/Dockerfile
          - image: billets
            context: .
            dockerfile: services/billets/Dockerfile
          - image: commandes
            context: .
            dockerfile: services/commandes/Dockerfile
          - image: file-attente
            context: .
            dockerfile: services/file-attente/Dockerfile
          - image: paiements
            context: .
            dockerfile: services/paiements/Dockerfile
          - image: notifications
            context: .
            dockerfile: services/notifications/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Le front garde /api et /auth relatifs : même origine que l'API (aucune variable VITE_).
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/agne-moussa/billetterie-${{ matrix.image }}:sha-${{ github.sha }}
            ghcr.io/agne-moussa/billetterie-${{ matrix.image }}:demo
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deployer:
    needs: images
    # Toujours après images, même sautée (entrée tag fournie), jamais si elle a échoué.
    if: >-
      always() && github.ref == 'refs/heads/main'
      && (needs.images.result == 'success' || needs.images.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Accès SSH à la VM et jeton GHCR, portés par l'environnement GitHub « demo ».
    environment: demo
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Entrée tag validée avant tout usage (lue par env:, jamais interpolée dans le script) :
      # seul un sha-<commit> est accepté, ce qui écarte toute injection dans .env.prod.
      - name: Tag à déployer
        id: tag
        shell: bash
        env:
          TAG_FOURNI: ${{ inputs.tag }}
          COMMIT: ${{ github.sha }}
        run: |
          if [[ -n "$TAG_FOURNI" ]]; then
            tag="$TAG_FOURNI"
          else
            tag="sha-$COMMIT"
          fi
          if ! [[ "$tag" =~ ^sha-[0-9a-f]{7,40}$ ]]; then
            printf '::error::Tag refusé : attendu sha-<commit> (7 à 40 caractères hexadécimaux).\n'
            exit 1
          fi
          printf 'valeur=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      # Clé privée dans un fichier aux droits 600 ; clé d'hôte du VPS vérifiée (known_hosts).
      - name: Configurer SSH
        env:
          CLE_SSH: ${{ secrets.VPS_CLE_SSH }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          HOTE: ${{ secrets.VPS_HOTE }}
          UTILISATEUR: ${{ secrets.VPS_UTILISATEUR }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$CLE_SSH" > ~/.ssh/id_deploiement
          chmod 600 ~/.ssh/id_deploiement
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          {
            printf 'Host vps\n'
            printf '  HostName %s\n' "$HOTE"
            printf '  User %s\n' "$UTILISATEUR"
            printf '  IdentityFile ~/.ssh/id_deploiement\n'
            printf '  IdentitiesOnly yes\n'
            printf '  StrictHostKeyChecking=yes\n'
            printf '  UserKnownHostsFile ~/.ssh/known_hosts\n'
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

      # BIL-017 : le dépôt est cloné sur la VM (scripts/vps-installer.sh) et .env.prod y est
      # écrit une fois par scripts/vps-env.sh (secrets tirés sur la VM, jamais dans GitHub).
      # Le workflow ne pose que le tag d'images à déployer, puis relance la plateforme.
      - name: Déployer sur la VM
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.valeur }}
          COMMIT: ${{ github.sha }}
          GHCR_UTILISATEUR: ${{ secrets.GHCR_UTILISATEUR }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          set -e
          # Jeton GHCR read:packages (paquets privés), lu par docker login sur son entrée standard.
          printf '%s' "$GHCR_TOKEN" | ssh vps "docker login ghcr.io -u \"$GHCR_UTILISATEUR\" --password-stdin"
          ssh vps "cd /opt/billetterie && git fetch --quiet origin && git checkout --quiet $COMMIT             && sed -i 's/^IMAGE_TAG=.*/IMAGE_TAG=$IMAGE_TAG/' .env.prod             && docker compose -f compose.prod.yaml --env-file .env.prod pull             && docker compose -f compose.prod.yaml --env-file .env.prod up -d --wait --remove-orphans             && docker compose -f compose.prod.yaml --env-file .env.prod run --rm --no-deps catalogue-migrations python -m catalogue.demo"

      - name: Nettoyer la clé SSH
        if: always()
        run: rm -f ~/.ssh/id_deploiement
