name: CI

on:
  pull_request:
  push:
    branches: [main]

# Une nouvelle poussée sur la même branche annule l'exécution précédente.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Détecte les dossiers modifiés pour ne lancer le job frontend que si besoin.
  # Un job ignoré compte comme réussi, ce qui permet de le rendre obligatoire.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              # Un contrat modifié change les types générés du front (api:gen).
              - 'services/*/openapi.yaml'

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  types:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      # Les dossiers vérifiés sont listés dans [tool.mypy] files du pyproject.toml.
      - run: uv run mypy

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      # tests/unit et services/*/tests/unit (voir le Makefile).
      - run: make test-unit

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      # Docker est disponible sur ubuntu-latest : Testcontainers lance ses conteneurs.
      # tests/integration et services/*/tests/integration (voir le Makefile).
      - run: make test-integration

  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      # Actif dès qu'un service a son contrat : un service sans test de contrat fait échouer le job.
      - name: Schéma généré contre contrat
        run: |
          if ls services/*/openapi.yaml >/dev/null 2>&1; then
            uv run pytest -m contract
          else
            echo "Aucun contrat OpenAPI dans services/ : rien à comparer."
          fi

  # Images des services, du vérificateur et du front en amd64 et arm64 (démo sur VPS ARM), sans
  # publication.
  images:
    name: images (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - image: echo
            context: .
            dockerfile: services/echo/Dockerfile
          - image: verificateur
            context: .
            dockerfile: infra/verificateur/Dockerfile
          - image: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # Scan de secrets sur tout l'historique Git (BIL-F29, CA3) : règles par défaut et exceptions
  # ciblées de .gitleaks.toml, valeurs trouvées masquées dans le journal (--redact).
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scanner l'historique
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/depot" zricethezav/gitleaks:v8.28.0
          git /depot --config /depot/.gitleaks.toml --redact --no-banner --verbose

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Types générés depuis services/*/openapi.yaml : ils doivent être à jour dans le commit.
      - name: Types d'API générés à jour
        run: |
          npm run api:gen
          git diff --exit-code -- src/api/genere
          # Un fichier généré pour un nouveau service mais non commité échappe à git diff.
          test -z "$(git status --porcelain -- src/api/genere)"
      - run: npm run lint
      # Types de tout le front, tests et parcours Playwright compris (le build ne vérifie que src/).
      - run: npm run typecheck
      - run: npm run test -- --run
      - run: npm run build
      # Parcours joués en local contre make up ; ici, on vérifie seulement qu'ils se chargent.
      - run: npx playwright test --list
