# Front servi derrière Traefik (route / hors /api et /auth, priorité la plus basse).
# Port 8080 : l'image nginx-unprivileged ne tourne pas en root et ne peut écouter sous 1024.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Fichiers versionnés par Vite (empreinte dans le nom) : jamais modifiés, cache d'un an.
    # Un fichier absent répond 404, pas index.html.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html et repli SPA : toute route inconnue sert index.html (React Router décide),
    # revalidé à chaque visite pour pointer toujours vers les derniers fichiers versionnés.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
