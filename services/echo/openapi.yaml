# Contrat OpenAPI 3.1 du service echo : la référence que le code doit respecter.
# Vérifié en CI par services/echo/tests/contract (pytest -m contract).
openapi: 3.1.0
info:
  title: Service echo
  version: 0.1.0
paths:
  /health:
    get:
      tags:
      - santé
      summary: État de l'instance, appelé par Consul toutes les 10 s
      operationId: sante
      responses:
        '200':
          description: L'instance et sa base répondent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sante'
        '503':
          description: La base de données ne répond pas.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Probleme'
  /api/v1/echos:
    post:
      tags:
      - echos
      summary: Enregistrer un message
      operationId: creerEcho
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EchoCreation'
        required: true
      responses:
        '201':
          description: Message enregistré.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EchoReponse'
        '409':
          description: Le message est déjà enregistré (ECHO_EXISTANT).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Probleme'
        '422':
          description: Corps invalide (REQUETE_INVALIDE).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Probleme'
  /api/v1/echos/{message}:
    get:
      tags:
      - echos
      summary: Relire un message enregistré
      operationId: lireEcho
      parameters:
      - name: message
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 100
          title: Message
      responses:
        '200':
          description: Message enregistré, avec l'instance qui a répondu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EchoReponse'
        '404':
          description: Aucun echo pour ce message (ECHO_INTROUVABLE).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Probleme'
        '422':
          description: Message invalide (REQUETE_INVALIDE).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Probleme'
components:
  schemas:
    EchoCreation:
      properties:
        message:
          type: string
          maxLength: 100
          minLength: 1
          title: Message
          examples:
          - bonjour
      type: object
      required:
      - message
      title: EchoCreation
    EchoReponse:
      properties:
        message:
          type: string
          title: Message
        instance:
          type: string
          title: Instance
          description: Instance qui a traité la requête.
        cree_le:
          type: string
          format: date-time
          title: Cree Le
      type: object
      required:
      - message
      - instance
      - cree_le
      title: EchoReponse
    Probleme:
      properties:
        type:
          type: string
          title: Type
          default: about:blank
        title:
          type: string
          title: Title
        status:
          type: integer
          title: Status
        detail:
          type: string
          title: Detail
        code:
          type: string
          title: Code
          description: Code métier stable, par exemple ECHO_INTROUVABLE.
        erreurs:
          anyOf:
          - items:
              additionalProperties: true
              type: object
            type: array
          - type: 'null'
          title: Erreurs
          description: Détail des champs invalides (code REQUETE_INVALIDE).
      type: object
      required:
      - title
      - status
      - detail
      - code
      title: Probleme
    Sante:
      properties:
        statut:
          type: string
          title: Statut
          examples:
          - ok
      type: object
      required:
      - statut
      title: Sante
