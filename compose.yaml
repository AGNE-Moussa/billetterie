# Plateforme locale de développement : briques de données et e-mails.
# Démarrage : make up (attend que tous les conteneurs soient healthy).
# Variables lues depuis .env, copié de .env.example.

name: billetterie

services:
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?à définir dans .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?à définir dans .env}
      # Lus par infra/postgres/init/01-bases.sh : un utilisateur par service.
      ECHO_DB_PASSWORD: ${ECHO_DB_PASSWORD:?à définir dans .env}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?à définir dans .env}
      CATALOGUE_DB_PASSWORD: ${CATALOGUE_DB_PASSWORD:?à définir dans .env}
      BILLETS_DB_PASSWORD: ${BILLETS_DB_PASSWORD:?à définir dans .env}
      COMMANDES_DB_PASSWORD: ${COMMANDES_DB_PASSWORD:?à définir dans .env}
      PAIEMENTS_DB_PASSWORD: ${PAIEMENTS_DB_PASSWORD:?à définir dans .env}
      NOTIFICATIONS_DB_PASSWORD: ${NOTIFICATIONS_DB_PASSWORD:?à définir dans .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Exécuté une seule fois, au premier démarrage sur un volume vide.
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      # Par TCP et non par socket : pendant l'initialisation, PostgreSQL n'écoute
      # que sur son socket, le conteneur ne passe donc healthy qu'une fois les bases créées.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [billetterie]

  redis:
    image: redis:7.4.6-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [billetterie]

  rabbitmq:
    image: rabbitmq:3.13.7-management-alpine
    # Nom d'hôte fixe : RabbitMQ range ses données sous le nom du nœud.
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?à définir dans .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?à définir dans .env}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:5672:5672"     # AMQP
      - "127.0.0.1:15672:15672"   # interface de gestion
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks: [billetterie]

  consul:
    image: hashicorp/consul:1.21.5
    # Un seul nœud serveur, en mode dev (état en mémoire) : suffisant en local.
    command: ["agent", "-dev", "-client=0.0.0.0", "-ui", "-config-dir=/consul/definitions"]
    volumes:
      # Services qui ne s'inscrivent pas eux-mêmes (Keycloak), avec leurs tags Traefik.
      - ./infra/consul:/consul/definitions:ro
    ports:
      - "127.0.0.1:8500:8500"   # API HTTP et interface web
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [billetterie]

  # --- Observabilité ----------------------------------------------------------------------
  # Tempo démarre toujours (léger) : les traces sont collectées sans erreur d'export. Prometheus
  # et Grafana sont dans le profil « observabilite » (make observabilite).
  tempo:
    image: grafana/tempo:2.8.2
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./infra/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
    # Traces éphémères : effacées à l'arrêt du conteneur.
    tmpfs:
      - /var/tempo:mode=1777
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3200/ready"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    networks: [billetterie]

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [observabilite]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      consul:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [billetterie]

  grafana:
    image: grafana/grafana:12.1.1
    profiles: [observabilite]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?à définir dans .env}
      # Consultation sans compte (lecture seule) : le tableau de bord s'ouvre directement.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/tableaux/billetterie.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/tableaux:/var/lib/grafana/tableaux:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
      tempo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [billetterie]

  traefik:
    image: traefik:v3.5.3
    # Routes découvertes dans Consul (tags), middlewares dans dynamique.yml.
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:?à définir dans .env}
    volumes:
      - ./infra/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./infra/traefik/dynamique.yml:/etc/traefik/dynamique.yml:ro
      - ./infra/traefik/plugins-local:/plugins-local:ro
    ports:
      # Gateway : un seul domaine (http://localhost) pour l'API, /auth et le front.
      - "127.0.0.1:80:80"
      - "127.0.0.1:8080:8080"   # tableau de bord, en local seulement
    depends_on:
      consul:
        condition: service_healthy
      tempo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [billetterie]

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.1
    # Mode dev en local ; le realm versionné est importé s'il n'existe pas encore.
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?à définir dans .env}
      KC_HTTP_RELATIVE_PATH: /auth
      # Adresse publique fixe : les jetons portent toujours l'émetteur http://localhost/auth.
      KC_HOSTNAME: http://localhost/auth
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?à définir dans .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?à définir dans .env}
      # Remplacent les ${...} de infra/keycloak/realm-billetterie.json à l'import.
      KEYCLOAK_SERVICES_SECRET: ${KEYCLOAK_SERVICES_SECRET:?à définir dans .env}
      KEYCLOAK_MDP_CLIENT: ${KEYCLOAK_MDP_CLIENT:?à définir dans .env}
      KEYCLOAK_MDP_PARTENAIRE: ${KEYCLOAK_MDP_PARTENAIRE:?à définir dans .env}
      KEYCLOAK_MDP_ADMIN: ${KEYCLOAK_MDP_ADMIN:?à définir dans .env}
      # Origine du front (redirect URIs du client frontend) : http://localhost si vide.
      KEYCLOAK_URL_FRONT: ${KEYCLOAK_URL_FRONT:-http://localhost}
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # L'image n'a ni curl ni wget : requête HTTP faite par bash sur le port de gestion.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /auth/health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 &&
          head -n 1 <&3 | grep -q ' 200'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [billetterie]

  # Vérificateur de jetons appelé par Traefik (middleware verification-jeton de dynamique.yml).
  verificateur:
    image: billetterie/verificateur:dev
    build:
      context: .
      dockerfile: infra/verificateur/Dockerfile
    environment:
      # Émetteur public des jetons (KC_HOSTNAME) ; clés lues par le réseau interne.
      JWT_EMETTEUR: http://localhost/auth/realms/${KEYCLOAK_REALM:?à définir dans .env}
      JWT_AUDIENCE: billetterie-api
      JWKS_URL: http://keycloak:8080/auth/realms/${KEYCLOAK_REALM:?à définir dans .env}/protocol/openid-connect/certs
      ROUTES_PUBLIQUES: ${ROUTES_PUBLIQUES:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
    networks: [billetterie]

  # --- Service echo : modèle des services métier ------------------------------------------
  # Les migrations tournent une seule fois, avant les instances (pas de course entre elles).
  echo-migrations:
    image: billetterie/echo:dev
    build:
      context: .
      dockerfile: services/echo/Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment: &echo-env
      DATABASE_URL: postgresql+asyncpg://echo:${ECHO_DB_PASSWORD:?à définir dans .env}@postgres:5432/echo
      CONSUL_URL: http://consul:8500
      # Relais de l'outbox : publie les événements sur l'exchange ticketing.
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:?à définir dans .env}:${RABBITMQ_DEFAULT_PASS:?à définir dans .env}@rabbitmq:5672/
      # Traces exportées vers Tempo (commun.observabilite).
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      # Revérification des jetons par le service (commun.auth), comme le vérificateur.
      JWT_EMETTEUR: http://localhost/auth/realms/${KEYCLOAK_REALM:?à définir dans .env}
      JWKS_URL: http://keycloak:8080/auth/realms/${KEYCLOAK_REALM:?à définir dans .env}/protocol/openid-connect/certs
    depends_on:
      postgres:
        condition: service_healthy
    networks: [billetterie]

  echo-1: &echo-instance
    image: billetterie/echo:dev
    environment:
      <<: *echo-env
      INSTANCE: echo-1
    depends_on:
      echo-migrations:
        condition: service_completed_successfully
      consul:
        condition: service_healthy
    networks: [billetterie]

  echo-2:
    <<: *echo-instance
    environment:
      <<: *echo-env
      INSTANCE: echo-2

  # --- Front : React construit par Vite, servi par Nginx -----------------------------------
  # Routé par Traefik sur / hors /api et /auth (priorité 1) : tags dans infra/consul/frontend.json.
  # Nginx non privilégié (utilisateur nginx, port 8080).
  frontend:
    image: billetterie/frontend:dev
    build:
      context: ./frontend
      dockerfile: Dockerfile
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [billetterie]

  mailpit:
    image: axllent/mailpit:v1.27.10
    ports:
      - "127.0.0.1:1025:1025"   # SMTP
      - "127.0.0.1:8025:8025"   # boîte de réception web
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [billetterie]

networks:
  billetterie:
    name: billetterie

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
